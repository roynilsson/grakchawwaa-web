services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
      - ./next:/app/.next
    networks:
      - grakchawwaa-network

networks:
  grakchawwaa-network:
    external: true
