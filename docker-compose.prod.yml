services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: grakchawwaa-web
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Port exposed to localhost only - nginx on host handles external traffic
