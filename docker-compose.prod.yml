services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: grakchawwaa-web
    environment:
      - NEXT_PUBLIC_BACKEND_URL=https://api.grakchawwaa.com
      - NODE_ENV=production
    networks:
      - grakchawwaa-internal
    restart: unless-stopped
    # No ports exposed - nginx handles external traffic

  nginx:
    image: nginx:alpine
    container_name: grakchawwaa-web-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - grakchawwaa-internal
    restart: unless-stopped

networks:
  grakchawwaa-internal:
    driver: bridge
